<!-- <div class="card"> -->
<p-toast position="top-center"></p-toast>
<p-confirmdialog />

<p-toolbar>
    <ng-template #start>
        <p-button text label="Indietro" class="mr-2" (onClick)="goBehind()" icon="pi pi-arrow-left" severity="secondary"></p-button>
        <p-button text label="Esporta" icon="pi pi-file-excel" (click)="onExportExcel()" [disabled]="parentCategories.length == 0" severity="secondary"></p-button>
    </ng-template>
    <ng-template #center>
        <p-iconfield iconPosition="left">
            <p-inputicon styleClass="pi pi-search" />
            <input type="text" pInputText placeholder="Search" (input)="onSearch($event)" />
        </p-iconfield>
    </ng-template>
    <ng-template #end>
      <p-button 
            type="button"
            icon="pi pi-plus"
            label="Categoria"
            class="mr-2 "
            (click)="showCreateDialogParentCategory()">
      </p-button>
    </ng-template>
</p-toolbar>

<!-- TABELLA CATEGORIE PADRE -->
<p-table
  [paginator]="true" [rows]="10"
  [value]="parentCategories"
  dataKey="id"
  stripedRows
  selectionMode="single"
  [(selection)]="selectedParent"
  (onRowSelect)="loadChildCategories()"
  (onRowUnselect)="clearChildCategories()"
  [tableStyle]="{ 'min-width': '50rem', 'margin-top': '1.5rem' }"
>

  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
      <th pSortableColumn="description">Description <p-sortIcon field="description" /></th>
      <th></th>
      <th></th>
      <th></th>
    </tr>
  </ng-template>
  
  <ng-template pTemplate="body" let-cat let-ri="rowIndex">
    <tr [formGroup]="parentCategoryForm" [pEditableRow]="cat" [pSelectableRow]="cat">

      <td field="name" >
        {{ cat.name }}
          <!-- <p-cellEditor>
              <ng-template pTemplate="input">
                  <input pInputText formControlName="name" style="width: 100%;"/>
              </ng-template>
              <ng-template pTemplate="output">
                  {{ cat.name }}
              </ng-template>
          </p-cellEditor> -->
      </td>

      <td field="description">
        {{ cat.description }}
          <!-- <p-cellEditor>
              <ng-template pTemplate="input">
                  <input pInputText formControlName="description" style="width: 100%;" />
              </ng-template>
              <ng-template pTemplate="output">
                  {{ cat.description }}
              </ng-template>
          </p-cellEditor> -->
      </td>

      <td>
          <div class="items-center justify-center">
              <p-button 
                      label="Sotto Categoria"
                      icon="pi pi-plus"
                      (click)="showCreateDialogChildCategory(cat.id)">
              </p-button>
          </div>
      </td>

      <td>
          <div class="items-center justify-center">
              <p-button 
                      label="Modifica"
                      severity="info"
                      icon="pi pi-pencil"
                      (click)="onRowEditInit(cat)">
              </p-button>
          </div>
      </td>

      <td>
          <div class="items-center justify-center">
              <p-button 
                      label="Elimina"
                      severity="danger"
                      icon="pi pi-trash"
                      (click)="onDeleteParentCategory(cat.id, $event)">
              </p-button>
          </div>
      </td>

    </tr>
  </ng-template>

  <ng-template #emptymessage>
      <tr>
          <td colspan="5">
              <!-- There are no products yet. -->
              <div class="items-center justify-center">
                  <p-button 
                      icon="pi pi-plus"
                      label="Categoria"
                      (click)="showCreateDialogParentCategory()">
                  </p-button>
              </div>
          </td>
      </tr>
  </ng-template>

</p-table>

<!-- TABELLA FIGLIE -->
<p-table
  *ngIf="selectedParent"
  [value]="childCategories"
  dataKey="id"
  stripedRows
  [tableStyle]="{ 'min-width': '50rem', 'margin-top': '2rem' }"
>

      <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
      <th pSortableColumn="description">Description <p-sortIcon field="description" /></th>
      <th></th>
      <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-child let-ri="rowIndex">

    <tr [formGroup]="childCategoryForm" [pEditableRow]="child">

      <td field="name">
        {{ child.name }}
<!-- 
          <p-cellEditor>
              <ng-template pTemplate="input">
                  <input pInputText formControlName="name" style="width: 100%;"/>
              </ng-template>
              <ng-template pTemplate="output">
                  {{ child.name }}
              </ng-template>
          </p-cellEditor> -->
      </td>

      <td field="description">
        {{ child.description }}
          <!-- <p-cellEditor>
              <ng-template pTemplate="input">
                  <input pInputText formControlName="description" style="width: 100%;" />
              </ng-template>
              <ng-template pTemplate="output">
                  {{ child.description }}
              </ng-template>
          </p-cellEditor> -->
      </td>

      <td>
          <div class="items-center justify-center">
              <p-button 
                      label="Modifica"
                      severity="info"
                      icon="pi pi-pencil"
                      (click)="onRowEditInit(child)">
              </p-button>
          </div>
      </td>

      <td>
          <div class="items-center justify-center">
              <p-button 
                      label="Elimina"
                      severity="danger"
                      icon="pi pi-trash"
                      (click)="onDeleteChildCategory(child.id, $event)">
              </p-button>
          </div>
      </td>

    </tr>
  </ng-template>
  
  <ng-template #emptymessage>
      <tr>
          <td colspan="4">
              <!-- There are no products yet. -->
              <div class="items-center justify-center">
                  <p-button 
                      icon="pi pi-plus"
                      label="Sotto Categoria"
                      (click)="showCreateDialogChildCategory(selectedParent.id)">
                  </p-button>
              </div>
          </td>
      </tr>
  </ng-template>

</p-table>
<!-- </div> -->


<p-dialog
  [(visible)]="displayParentCategoryDialog"
  [modal]="true"
  [style]="{ width: '50rem' }"
  [baseZIndex]="10000"
  [dismissableMask]="true"
  [closeOnEscape]="true"
  header="{{ isEditMode ? 'Modifica' : 'Crea' }} categoria" 
  [breakpoints]="{ '960px': '75vw', '640px': '90vw' }"
>

  <form [formGroup]="parentCategoryForm">
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 mb-2">
        <!-- <p-floatlabel > -->
            <label class="block font-bold mb-2" for="name">Name</label>
            <input id="name" pInputText class="form-control" formControlName="name" />
        <!-- </p-floatlabel> -->
      </div>
      <div class="col-lg-12 col-md-12 col-sm-12 mb-2">
        <!-- <p-floatlabel > -->
            <label class="block font-bold mb-2" for="description">Description</label>
            <input id="description" pInputText class="form-control" formControlName="description" />
        <!-- </p-floatlabel> -->
      </div>
    </div>
  </form>

  <ng-template #footer >
    <div class="row w-100">
        <div class="col-lg-6 col-md-6 col-sm-12 text-center mb-2">
            <p-button label="{{ isEditMode ? 'Modifica' : 'Crea' }} categoria" (onClick)="onCreateCategory()" [disabled]="parentCategoryForm.invalid" icon="pi pi-save"></p-button>
        </div>
        <div class="col-lg-6 col-md-6 col-sm-12 text-center mb-2">
            <p-button label="Chiudi schermata" (onClick)="displayParentCategoryDialog = false;" severity="info" icon="pi pi-times"></p-button>
        </div>
    </div>
  </ng-template>

</p-dialog>

<p-dialog
  [(visible)]="displayChildCategoryDialog"
  [modal]="true"
  [style]="{ width: '50rem' }"
  [baseZIndex]="10000"
  [dismissableMask]="true"
  [closeOnEscape]="true"
  header="{{ isEditMode ? 'Modifica' : 'Crea' }} sotto categoria" 
  [breakpoints]="{ '960px': '75vw', '640px': '90vw' }"
>

  <form [formGroup]="childCategoryForm">
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 mb-2">
          <!-- <p-floatlabel > -->
              <label class="block font-bold mb-2" for="name">Name</label>
              <input id="name" pInputText class="form-control" formControlName="name" />
          <!-- </p-floatlabel> -->
      </div>
      <div class="col-lg-12 col-md-12 col-sm-12 mb-2">
          <!-- <p-floatlabel > -->
              <label class="block font-bold mb-2" for="description">Description</label>
              <textarea id="description" pTextarea class="form-control" formControlName="description" rows="3"></textarea>
          <!-- </p-floatlabel> -->
      </div>
    </div>
  </form>

  <ng-template #footer>
    <div class="row w-100">
      <div class="col-lg-6 col-md-6 col-sm-12 text-center mb-2">
        <p-button label="{{ isEditMode ? 'Modifica' : 'Crea' }} sotto categoria" (onClick)="onCreateChildCategory()" [disabled]="childCategoryForm.invalid" icon="pi pi-save"></p-button>
      </div>
      <div class="col-lg-6 col-md-6 col-sm-12 text-center mb-2">
        <p-button label="Chiudi schermata" (onClick)="displayChildCategoryDialog = false;" severity="info" icon="pi pi-times"></p-button>
      </div>
    </div>
  </ng-template>
</p-dialog>
